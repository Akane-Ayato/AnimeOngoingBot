services:
  - type: web
    name: anime-ongoing-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: LOG_CHANNEL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: IMG
        sync: false
      - key: MANHWA_CHANNEL_ID
        sync: false
      - key: SITE_URL
        value: https://ani-void-tv.vercel.app
      - key: API_BASE
        value: https://anikotoapi.site
      - key: DEFAULT_INTERVAL
        value: "300"
      - key: MANHWA_API
        value: https://b.toonking.xyz/api/local-manga
      - key: MANHWA_SITE
        value: https://manhwavoid.space
      - key: POSTER_SS
        value: "1"
      - key: KEEP_ALIVE
        value: "1"
